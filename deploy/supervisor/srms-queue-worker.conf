; Supervisor configuration for SRMS Queue Workers
; Install: sudo apt-get install supervisor
; Place in: /etc/supervisor/conf.d/srms-queue-worker.conf
; Reload: sudo supervisorctl reread && sudo supervisorctl update

[program:srms-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/srms/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/srms/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Health check endpoint
; supervisorctl status srms-queue-worker:*

[program:srms-queue-retry]
process_name=%(program_name)s
command=php /var/www/srms/artisan queue:retry all
autostart=false
autorestart=false
user=www-data
cron=*/30 * * * *

[program:srms-schedule]
process_name=%(program_name)s
command=php /var/www/srms/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/srms/storage/logs/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3