services:
  postgres-test:
    image: postgis/postgis:15-3.5
    container_name: srms-postgres-test
    environment:
      POSTGRES_DB: ethio_real_estate_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ethio_real_estate_test"]
      interval: 5s
      timeout: 3s
      retries: 5
